plugins {
    id 'java'
}

group = "ru.alfabank"

sourceCompatibility = 11
targetCompatibility = 11

repositories {
    mavenCentral()

    maven {
        url "https://repo.cryptopro.ru/repository/maven-public/"
    }
}

dependencies {
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.25'
    implementation group: 'org.codehaus.groovy', name: 'groovy-all', version: '3.0.19'
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.2.3'
    implementation group: 'com.google.guava', name: 'guava', version: '24.0-jre'
    implementation group: 'org.apache.commons', name: 'commons-math3', version: '3.6.1'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.7'
    implementation group: 'commons-io', name: 'commons-io', version: '2.6'
    implementation group: 'org.apache.santuario', name: 'xmlsec', version: '1.5.8'


    //Согласно ЖТЯИ.00091-01 33 01. Руководство программиста.pdf
    //Библиотека JCPxml.jar должна находиться вместе с библиотекой xmlsec.jar
    //Для работы проекта необходимо перенести данную библиотеку из ***/jre/ext/ в директорию libs проекта
    implementation fileTree(dir: 'env/lib/jcp', includes: ['*.jar'])
}

wrapper {
    gradleVersion = '7.5.1'
    distributionUrl = "https://services.gradle.org/distributions/gradle-$gradleVersion-bin.zip"
}